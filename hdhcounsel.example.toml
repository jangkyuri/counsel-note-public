[hdhcounsel]
# Relative paths resolve against THIS configuration file, not the shell directory.
models_dir = "models"
output_dir = "data/hdhcounsel"
device = "cuda"
compute_type = "float16"
batch_size = 4
diarize = true
# Set only if the number of speakers is known. Speaker IDs are NOT identities.
# num_speakers = 2
# CPU: device = "cpu", compute_type = "int8", batch_size = 1
# ffmpeg = "C:/tools/ffmpeg/bin/ffmpeg.exe"
timeout_seconds = 14400
# Optional separate speech environment; relative to this configuration file.
# worker_python = "C:/counsel-note/.venv-hdh/Scripts/python.exe"
